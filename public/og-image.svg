<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scan-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a" />
  
  <!-- Decorative Grid Background (Subtle) -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3" />

  <!-- Center Content Group -->
  <g transform="translate(600, 280)">
    
    <!-- Face Silhouette -->
    <path d="M-60 -40 C-60 -90 -30 -110 0 -110 C30 -110 60 -90 60 -40 V20 C60 70 30 100 0 100 C-30 100 -60 70 -60 20 V-40 Z" 
          fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.6" />
    <!-- Eyes -->
    <circle cx="-25" cy="-20" r="6" fill="#60a5fa" />
    <circle cx="25" cy="-20" r="6" fill="#60a5fa" />
    <!-- Nose/Mouth lines -->
    <path d="M0 -5 V25" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M-20 50 Q0 65 20 50" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Scanning Frame Corners -->
    <g stroke="#60a5fa" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#glow)">
      <!-- Top Left -->
      <path d="M-100 -80 L-100 -140 L-40 -140" />
      <!-- Top Right -->
      <path d="M100 -80 L100 -140 L40 -140" />
      <!-- Bottom Left -->
      <path d="M-100 80 L-100 140 L-40 140" />
      <!-- Bottom Right -->
      <path d="M100 80 L100 140 L40 140" />
    </g>

    <!-- Scanning Horizontal Beam -->
    <rect x="-110" y="-20" width="220" height="40" fill="url(#scan-gradient)" opacity="0.8">
      <animate attributeName="y" values="-140;100;-140" dur="3s" repeatCount="indefinite" />
    </rect>
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#60a5fa" stroke-width="2" opacity="0.8">
      <animate attributeName="y1" values="-120;120;-120" dur="3s" repeatCount="indefinite" />
      <animate attributeName="y2" values="-120;120;-120" dur="3s" repeatCount="indefinite" />
    </line>

  </g>

  <!-- Title Text -->
  <text x="600" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="56" fill="#f8fafc" letter-spacing="-1">
    얼굴 인식 출입 통제 시스템
  </text>
  
  <!-- Subtitle / Tagline -->
  <text x="600" y="570" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="normal" font-size="28" fill="#94a3b8">
    Face Recognition Access Control
  </text>

</svg>